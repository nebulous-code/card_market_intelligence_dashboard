# The sets we pay PokemonPriceTracker to refresh.
#
# This file is the control on spend. The catalogue ingest puts every set
# TCGdex publishes into the database so uploads can be validated against
# real sets; this file decides which of those we actually buy prices for.
#
# TO ADD A SET: uncomment its two lines below. Commit, and the next nightly
# run picks it up. Then backfill its rarity so condition multipliers work:
#
#     cd ingestion
#     DATABASE_URL="<prod>" uv run python run_ingest.py --set-id <set_id>
#
# TO REMOVE A SET: comment it out again. That stops future refreshes but
# KEEPS the price history already collected -- the set still counts as
# covered and its data simply stops advancing. Deleting months of snapshots
# because a line was commented out would be a wildly disproportionate amount
# of destruction for a small edit.
#
# Fields:
#   set_id     Canonical set id, matching sets.id (which is the TCGdex id).
#   ppt_name   The exact display name PokemonPriceTracker uses. A wrong name
#              is not an error -- it is a silent zero-result fetch that looks
#              identical to a set we have no data for.
#   tcgdex_id  Optional, defaults to set_id. Not needed for any set so far.
#
# Every name below was verified against the live PokemonPriceTracker API.
# To check a name yourself: tools/check_ppt_set.sh "Some Set Name"
#
# Credit budget is 20,000/day at 2 credits per card per night. The active
# list below currently costs roughly 870.

sets:
