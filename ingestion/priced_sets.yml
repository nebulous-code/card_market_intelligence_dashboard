# The sets we pay PokemonPriceTracker to refresh.
#
# This file is the control on spend. The catalogue ingest puts every set
# TCGdex publishes into the database so uploads can be validated against
# real sets; this file decides which of those we actually buy prices for.
#
# Adding an entry makes tonight's run price that set. Removing one stops
# future refreshes but KEEPS the price history already collected -- the set
# still counts as covered and its data simply stops advancing. Deleting
# months of snapshots because a line was removed from a config file would be
# a wildly disproportionate amount of destruction for a small edit.
#
# Fields:
#   set_id     Canonical set id. Must match sets.id, which is the TCGdex id.
#              A set that is not in the catalogue yet is reported and skipped,
#              not treated as an error -- it will resolve after the next
#              catalogue ingest. If it keeps appearing, the id is a typo.
#   ppt_name   The exact display name PokemonPriceTracker uses. Verify it
#              before adding: a wrong name here is not an error, it is a
#              silent zero-result fetch that looks like a set with no prices.
#   tcgdex_id  Optional. Defaults to set_id, which is correct for every set
#              so far. Only needed if the two ever diverge.
#
# The sync writes ('ppt', 'name') and ('tcgdex', 'id') rows into
# set_identifiers. It deliberately does not touch ('tcgdex', 'name') rows --
# those are hand-written operator aliases that let you run an ingest by
# typing a friendly name, and they are not derivable from this file.

sets:
  - set_id: base1
    ppt_name: Base Set

  - set_id: base2
    ppt_name: Jungle

  - set_id: base3
    ppt_name: Fossil

  - set_id: sv03.5
    ppt_name: "SV: Scarlet & Violet 151"
