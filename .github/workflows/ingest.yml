# Nightly price ingestion workflow.
#
# Runs the PokemonPriceTracker ingestion script every night at 2:00 AM US
# Eastern (07:00 UTC). Fetches current card prices for all sets in the
# database and writes them to Neon as price_snapshots rows.
#
# Required GitHub Actions secrets (set in repo Settings > Secrets):
#   DATABASE_URL                    -- Neon connection string
#   POKEMON_PRICE_TRACKER_API_KEY   -- PokemonPriceTracker API key
#
# Optional variables (Settings > Variables, NOT Secrets -- these are
# tuning knobs, not credentials, and being able to read them back is
# useful. Defaults below give free-tier behaviour):
#   PPT_INCLUDE_HISTORY             -- "true" to request price history (API tier).
#                                      Costs +1 credit/card but is the ONLY source
#                                      of per-condition prices (LP/MP/HP/DMG) --
#                                      without it every snapshot is Near Mint only
#                                      and the condition multipliers go stale.
#   PPT_HISTORY_DAYS                -- days of history to request (default 7).
#                                      Free tier caps at 3, API tier at 180.
#   PPT_INCLUDE_EBAY                -- "true" to request eBay graded prices (API tier).
#                                      Costs a further +1 credit/card.
#   PPT_MAX_CARDS                   -- cap cards fetched per run to reserve daytime credits.
#                                      Unset (or 0) means no cap (full nightly run).
#
# Email notification secrets (set in repo Settings > Secrets):
#   RESEND_API_KEY      -- Resend API key, used as the SMTP password.
#                          Same key the other nebulouscode projects use.
#   NOTIFY_EMAIL        -- Address to send the summary to
#
# Optional variables (Settings > Variables):
#   EMAIL_FROM          -- Overrides the sender. Must be an address on a
#                          domain verified in Resend, or the send is
#                          rejected. Defaults to the value below.
#
# Sending goes through Resend rather than Gmail. Gmail App Passwords are
# being retired, and a personal mail account was never the right sender
# for automated mail anyway -- deliverability depends on a verified
# sending domain, which Resend provides.
#
# The workflow can also be triggered manually from the Actions tab using
# workflow_dispatch, which is useful for testing or running a backfill.

name: Nightly Price Ingestion

on:
  schedule:
    # 07:00 UTC = 02:00 AM US Eastern (UTC-5 in winter, UTC-4 in summer).
    - cron: "0 7 * * *"
  workflow_dispatch:  # Allow manual runs from the GitHub Actions UI.

jobs:
  ingest:
    name: Run price ingestion
    runs-on: ubuntu-latest
    # Default values used if the ingestion script crashes before writing to GITHUB_ENV.
    # The script overwrites these on a normal run; they act as a fallback for hard failures.
    env:
      RUN_DATE: unknown
      RUN_STATUS: "❌ Failed (script did not complete)"
      EMAIL_BODY: "The ingestion script crashed before generating a summary. Check the log artifact for details."
      MULTIPLIER_STATUS: "Did not run"
      MULTIPLIER_SUMMARY: "Condition multiplier refresh did not run -- price ingestion failed before this step."

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          version: "latest"

      - name: Set up Python
        working-directory: ingestion
        run: uv python install

      - name: Install dependencies
        working-directory: ingestion
        run: uv sync --frozen

      - name: Run ingestion
        working-directory: ingestion
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          POKEMON_PRICE_TRACKER_API_KEY: ${{ secrets.POKEMON_PRICE_TRACKER_API_KEY }}
          # These default to "false" if the secret is not set, giving free-tier behaviour.
          PPT_INCLUDE_HISTORY: ${{ vars.PPT_INCLUDE_HISTORY || 'false' }}
          PPT_HISTORY_DAYS: ${{ vars.PPT_HISTORY_DAYS || '7' }}
          PPT_INCLUDE_EBAY: ${{ vars.PPT_INCLUDE_EBAY || 'false' }}
          # Cap cards per run to reserve daytime credits for testing.
          # Set this in repo Settings > Variables (not Secrets) to a number like 50.
          # Leave unset or set to 0 for a full uncapped run.
          PPT_MAX_CARDS: ${{ vars.PPT_MAX_CARDS || '0' }}
        run: uv run python run.py

      # Run the condition-multiplier refresh only when the price ingest
      # succeeded -- if prices didn't update there's nothing new to
      # recompute, and a successful multiplier run on stale data would be
      # misleading. The summary block this step writes is appended to the
      # email body via the MULTIPLIER_SUMMARY env var.
      - name: Refresh condition multipliers
        if: success()
        working-directory: ingestion
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: uv run python run_refresh_multipliers.py

      # Sweep expired user collection sessions. Cheap, idempotent, and the
      # only maintenance the collection_sessions table needs.
      - name: Clean up expired collection sessions
        if: success()
        working-directory: ingestion
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: uv run python cleanup_sessions.py

      - name: Upload ingestion log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ingestion-log-${{ github.run_id }}
          path: ingestion/ingestion.log
          retention-days: 7

      - name: Send ingestion summary email
        if: always()
        uses: dawidd6/action-send-mail@v3
        with:
          # Resend's SMTP bridge. The username is the literal string
          # "resend" for every account -- the API key is the password.
          server_address: smtp.resend.com
          server_port: 465
          secure: true
          username: resend
          password: ${{ secrets.RESEND_API_KEY }}
          subject: "[Card Market] Nightly Ingestion — ${{ env.RUN_DATE }} — ${{ env.RUN_STATUS }}"
          to: ${{ secrets.NOTIFY_EMAIL }}
          from: ${{ vars.EMAIL_FROM || 'Card Market Ingestion <noreply@mail.nebulouscode.com>' }}
          body: |
            ${{ env.EMAIL_BODY }}

            Condition multiplier refresh: ${{ env.MULTIPLIER_STATUS }}
            ${{ env.MULTIPLIER_SUMMARY }}
